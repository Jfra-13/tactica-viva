<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the bottom bar pads itself with the safe area -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Dark only: native controls and the first paint stay dark -->
    <meta name="color-scheme" content="dark" />
    <!-- PWA: theme-color mirrors --color-bg; the manifest link is injected at build -->
    <meta name="theme-color" content="#0b0e10" />
    <meta
      name="description"
      content="Pizarra táctica de fútbol 7 en tiempo real."
    />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PizarraF7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Fira Sans + Fira Code from Google Fonts until T9.1 self-hosts them (D-012) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500..700&family=Fira+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PizarraF7</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
